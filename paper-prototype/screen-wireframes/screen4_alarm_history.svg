<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <!-- Paper / Sketch Grid Background -->
  <rect width="1000" height="650" fill="#fffdf9" />
  <defs>
    <pattern id="grid4" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.8" />
    </pattern>
  </defs>
  <rect width="1000" height="650" fill="url(#grid4)" />

  <!-- Navigation Header Bar -->
  <rect x="25" y="15" width="950" height="50" rx="8" fill="#1e293b" />
  <rect x="40" y="27" width="40" height="25" rx="4" fill="#0284c7" />
  <text x="47" y="44" fill="#ffffff" font-family="'Patrick Hand', cursive, sans-serif" font-size="14" font-weight="bold">ICU</text>
  <text x="90" y="44" fill="#ffffff" font-family="'Patrick Hand', cursive, sans-serif" font-size="16" font-weight="bold">Smart ICU Alarm Dashboard</text>

  <!-- Navigation Tabs -->
  <rect x="420" y="25" width="90" height="30" rx="15" fill="none" stroke="#475569" stroke-dasharray="3,3" />
  <text x="432" y="45" fill="#cbd5e1" font-family="'Patrick Hand', cursive, sans-serif" font-size="13">Dashboard</text>
  <rect x="520" y="25" width="125" height="30" rx="15" fill="#0284c7" />
  <text x="532" y="45" fill="#ffffff" font-family="'Patrick Hand', cursive, sans-serif" font-size="13" font-weight="bold">📋 Shift History Log</text>

  <!-- User / Nurse Badge -->
  <text x="800" y="45" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">11:55:00</text>
  <circle cx="875" cy="40" r="5" fill="#10b981" />
  <text x="888" y="45" fill="#ffffff" font-family="'Patrick Hand', cursive, sans-serif" font-size="13">Nurse Priya</text>

  <!-- History Container Box (Hand-drawn wobbly box) -->
  <g transform="translate(25, 80)">
    <rect width="950" height="540" rx="10" fill="#ffffff" stroke="#1e293b" stroke-width="2.2" filter="drop-shadow(2px 3px 0px rgba(0,0,0,0.06))" />

    <!-- Top Title & Back Button -->
    <g transform="translate(20, 20)">
      <text x="0" y="18" fill="#0f172a" font-family="'Architects Daughter', cursive, sans-serif" font-size="19" font-weight="bold">
        Shift Alarm History Log
      </text>
      <text x="0" y="38" fill="#64748b" font-family="'Patrick Hand', cursive, sans-serif" font-size="13">
        Chronological record of all alarms acknowledged or resolved by Nurse Priya
      </text>
      <rect x="750" y="5" width="160" height="34" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
      <text x="765" y="28" fill="#334155" font-family="'Patrick Hand', cursive, sans-serif" font-size="13" font-weight="bold">
        ← Back to Dashboard
      </text>
      <line x1="0" y1="52" x2="910" y2="52" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4" />
    </g>

    <!-- Table Header -->
    <g transform="translate(20, 85)">
      <rect width="910" height="36" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="15" y="23" fill="#334155" font-family="'Architects Daughter', cursive, sans-serif" font-size="12" font-weight="bold">TIMESTAMP</text>
      <text x="130" y="23" fill="#334155" font-family="'Architects Daughter', cursive, sans-serif" font-size="12" font-weight="bold">BED</text>
      <text x="220" y="23" fill="#334155" font-family="'Architects Daughter', cursive, sans-serif" font-size="12" font-weight="bold">PATIENT</text>
      <text x="360" y="23" fill="#334155" font-family="'Architects Daughter', cursive, sans-serif" font-size="12" font-weight="bold">CLINICAL ALARM</text>
      <text x="610" y="23" fill="#334155" font-family="'Architects Daughter', cursive, sans-serif" font-size="12" font-weight="bold">PRIORITY</text>
      <text x="710" y="23" fill="#334155" font-family="'Architects Daughter', cursive, sans-serif" font-size="12" font-weight="bold">STATUS</text>
      <text x="810" y="23" fill="#334155" font-family="'Architects Daughter', cursive, sans-serif" font-size="12" font-weight="bold">ACTION BY</text>
    </g>

    <!-- Table Row 1 (Bed 1 Resolved) -->
    <g transform="translate(20, 130)">
      <rect width="910" height="48" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <text x="15" y="30" fill="#0f172a" font-family="monospace" font-size="13" font-weight="bold">11:42:10</text>
      <text x="130" y="30" fill="#0f172a" font-family="'Patrick Hand', cursive, sans-serif" font-size="14" font-weight="bold">Bed 1</text>
      <text x="220" y="30" fill="#0f172a" font-family="'Patrick Hand', cursive, sans-serif" font-size="13">Rajesh Kumar</text>
      <text x="360" y="30" fill="#0f172a" font-family="'Patrick Hand', cursive, sans-serif" font-size="13">Oxygen Drop &lt;90% (SpO2 88%)</text>
      <rect x="610" y="14" width="55" height="20" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1" />
      <text x="622" y="28" fill="#b91c1c" font-family="'Patrick Hand', cursive, sans-serif" font-size="10" font-weight="bold">HIGH</text>
      <text x="710" y="30" fill="#15803d" font-family="'Patrick Hand', cursive, sans-serif" font-size="13" font-weight="bold">Resolved</text>
      <text x="810" y="30" fill="#334155" font-family="'Patrick Hand', cursive, sans-serif" font-size="13">👩‍⚕️ Nurse Priya</text>
    </g>

    <!-- Table Row 2 (Bed 2 Resolved) -->
    <g transform="translate(20, 185)">
      <rect width="910" height="48" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <text x="15" y="30" fill="#0f172a" font-family="monospace" font-size="13" font-weight="bold">11:15:04</text>
      <text x="130" y="30" fill="#0f172a" font-family="'Patrick Hand', cursive, sans-serif" font-size="14" font-weight="bold">Bed 2</text>
      <text x="220" y="30" fill="#0f172a" font-family="'Patrick Hand', cursive, sans-serif" font-size="13">Sunita Devi</text>
      <text x="360" y="30" fill="#0f172a" font-family="'Patrick Hand', cursive, sans-serif" font-size="13">Rapid Breathing (26 /min)</text>
      <rect x="610" y="14" width="65" height="20" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" />
      <text x="618" y="28" fill="#b45309" font-family="'Patrick Hand', cursive, sans-serif" font-size="10" font-weight="bold">MEDIUM</text>
      <text x="710" y="30" fill="#15803d" font-family="'Patrick Hand', cursive, sans-serif" font-size="13" font-weight="bold">Resolved</text>
      <text x="810" y="30" fill="#334155" font-family="'Patrick Hand', cursive, sans-serif" font-size="13">👩‍⚕️ Nurse Priya</text>
    </g>

    <!-- Table Row 3 (Bed 4 Resolved) -->
    <g transform="translate(20, 240)">
      <rect width="910" height="48" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <text x="15" y="30" fill="#0f172a" font-family="monospace" font-size="13" font-weight="bold">10:50:22</text>
      <text x="130" y="30" fill="#0f172a" font-family="'Patrick Hand', cursive, sans-serif" font-size="14" font-weight="bold">Bed 4</text>
      <text x="220" y="30" fill="#0f172a" font-family="'Patrick Hand', cursive, sans-serif" font-size="13">Meena Sharma</text>
      <text x="360" y="30" fill="#0f172a" font-family="'Patrick Hand', cursive, sans-serif" font-size="13">ECG Lead V4 Sticker Detached</text>
      <rect x="610" y="14" width="50" height="20" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" />
      <text x="622" y="28" fill="#0369a1" font-family="'Patrick Hand', cursive, sans-serif" font-size="10" font-weight="bold">LOW</text>
      <text x="710" y="30" fill="#15803d" font-family="'Patrick Hand', cursive, sans-serif" font-size="13" font-weight="bold">Resolved</text>
      <text x="810" y="30" fill="#334155" font-family="'Patrick Hand', cursive, sans-serif" font-size="13">👩‍⚕️ Nurse Priya</text>
    </g>

    <!-- Summary Box -->
    <g transform="translate(20, 310)">
      <rect width="910" height="55" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,3" />
      <text x="15" y="24" fill="#0f172a" font-family="'Patrick Hand', cursive, sans-serif" font-size="13" font-weight="bold">
        📋 Clinical Audit Summary for Shift Handover:
      </text>
      <text x="15" y="42" fill="#64748b" font-family="'Patrick Hand', cursive, sans-serif" font-size="12">
        Total Alarms Handled: <strong>3</strong> • Average Acknowledgement Speed: <strong>&lt; 35 seconds</strong> • False Alarm Nuisance: <strong>Reduced by 78%</strong> via Smart Triage.
      </text>
    </g>
  </g>

  <!-- Sticky Note Annotation -->
  <g transform="translate(770, 470) rotate(1.5)">
    <rect x="0" y="0" width="185" height="115" fill="#fef08a" stroke="#facc15" stroke-width="1.2" filter="drop-shadow(2px 3px 5px rgba(0,0,0,0.15))" />
    <rect x="65" y="-5" width="40" height="10" fill="rgba(250,204,21,0.5)" />
    <text x="12" y="22" fill="#713f12" font-family="'Caveat', cursive, sans-serif" font-size="14" font-weight="bold">💡 HCI EVALUATION NOTE:</text>
    <text x="12" y="40" fill="#713f12" font-family="'Caveat', cursive, sans-serif" font-size="13">Log starts 100% EMPTY.</text>
    <text x="12" y="56" fill="#713f12" font-family="'Caveat', cursive, sans-serif" font-size="13">Only real nurse actions</text>
    <text x="12" y="72" fill="#713f12" font-family="'Caveat', cursive, sans-serif" font-size="13">are written here.</text>
    <text x="12" y="92" fill="#713f12" font-family="'Caveat', cursive, sans-serif" font-size="13">Clean handover audit!</text>
  </g>
</svg>
