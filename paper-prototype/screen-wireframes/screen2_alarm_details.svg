<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <!-- Paper / Sketch Grid Background -->
  <rect width="1000" height="650" fill="#fffdf9" />
  <defs>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.8" />
    </pattern>
  </defs>
  <rect width="1000" height="650" fill="url(#grid2)" />

  <!-- Dimmed Overlay Effect -->
  <rect width="1000" height="650" fill="#0f172a" opacity="0.45" />

  <!-- Bedside Alarm Inspection Modal (Hand-drawn wobbly box) -->
  <g transform="translate(140, 35)">
    <!-- Modal Card Body -->
    <rect width="720" height="580" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="2.5" filter="drop-shadow(4px 6px 0px rgba(0,0,0,0.2))" />

    <!-- Header Section -->
    <g transform="translate(25, 20)">
      <rect x="0" y="0" width="55" height="24" rx="4" fill="#0284c7" />
      <text x="10" y="17" fill="#ffffff" font-family="'Patrick Hand', cursive, sans-serif" font-size="12" font-weight="bold">BED 1</text>
      <text x="68" y="19" fill="#0f172a" font-family="'Architects Daughter', cursive, sans-serif" font-size="18" font-weight="bold">Rajesh Kumar (Age 64)</text>
      <text x="645" y="18" fill="#475569" font-family="'Patrick Hand', cursive, sans-serif" font-size="14" font-weight="bold">[✕ Close]</text>
      <line x1="0" y1="32" x2="670" y2="32" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4" />
    </g>

    <!-- Bio Box (Short Forms) -->
    <g transform="translate(25, 65)">
      <rect width="670" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
      <text x="15" y="22" fill="#0f172a" font-family="'Patrick Hand', cursive, sans-serif" font-size="12.5">
        <tspan font-weight="bold">Condition:</tspan> Post Heart Surgery &nbsp;&nbsp;|&nbsp;&nbsp; <tspan font-weight="bold">Doctor:</tspan> Dr. Mehta (Heart Specialist)
      </text>
      <text x="15" y="42" fill="#64748b" font-family="'Patrick Hand', cursive, sans-serif" font-size="12">
        <tspan font-weight="bold">Devices:</tspan> Oxygen Mask (4L/min), IV Saline Drip &nbsp;&nbsp;|&nbsp;&nbsp; <tspan font-weight="bold">Target:</tspan> Keep Oxygen &gt;92%, Heart Rate 60-100
      </text>
    </g>

    <!-- Alarm Callout (Red Alert) -->
    <g transform="translate(25, 128)">
      <rect width="670" height="50" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8" />
      <text x="15" y="24" fill="#991b1b" font-family="'Patrick Hand', cursive, sans-serif" font-size="13.5" font-weight="bold">
        🚨 Critical: Oxygen Level Dangerously Low (SpO2 88%)
      </text>
      <text x="15" y="42" fill="#7f1d1d" font-family="'Patrick Hand', cursive, sans-serif" font-size="12">
        Patient oxygen dropped to 88% (safe is above 90%). Heart rate spiked to 125 bpm. Immediate bedside check needed.
      </text>
    </g>

    <!-- 4 Telemetry Vitals Chips (Single-Number Blood Pressure 70 mmHg!) -->
    <g transform="translate(25, 190)">
      <text x="0" y="0" fill="#64748b" font-family="'Patrick Hand', cursive, sans-serif" font-size="11" font-weight="bold">CURRENT BEDSIDE TELEMETRY (SINGLE-NUMBER FORMAT):</text>
      
      <!-- HR -->
      <rect x="0" y="10" width="155" height="58" rx="6" fill="#f8fafc" stroke="#ef4444" stroke-width="1.5" />
      <text x="77" y="28" text-anchor="middle" fill="#64748b" font-family="'Patrick Hand', cursive, sans-serif" font-size="10" font-weight="bold">HEART RATE</text>
      <text x="77" y="52" text-anchor="middle" fill="#dc2626" font-family="'Architects Daughter', cursive, sans-serif" font-size="18" font-weight="bold">125 bpm</text>

      <!-- SpO2 -->
      <rect x="172" y="10" width="155" height="58" rx="6" fill="#f8fafc" stroke="#ef4444" stroke-width="1.5" />
      <text x="249" y="28" text-anchor="middle" fill="#64748b" font-family="'Patrick Hand', cursive, sans-serif" font-size="10" font-weight="bold">OXYGEN (SpO2)</text>
      <text x="249" y="52" text-anchor="middle" fill="#dc2626" font-family="'Architects Daughter', cursive, sans-serif" font-size="18" font-weight="bold">88% sat</text>

      <!-- BP (Single Number MAP 70 mmHg!) -->
      <rect x="344" y="10" width="155" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="421" y="28" text-anchor="middle" fill="#64748b" font-family="'Patrick Hand', cursive, sans-serif" font-size="10" font-weight="bold">BLOOD PRESSURE</text>
      <text x="421" y="52" text-anchor="middle" fill="#0f172a" font-family="'Architects Daughter', cursive, sans-serif" font-size="18" font-weight="bold">70 mmHg</text>

      <!-- Resp -->
      <rect x="515" y="10" width="155" height="58" rx="6" fill="#f8fafc" stroke="#f59e0b" stroke-width="1.5" />
      <text x="592" y="28" text-anchor="middle" fill="#64748b" font-family="'Patrick Hand', cursive, sans-serif" font-size="10" font-weight="bold">BREATHING</text>
      <text x="592" y="52" text-anchor="middle" fill="#d97706" font-family="'Architects Daughter', cursive, sans-serif" font-size="18" font-weight="bold">26 /min</text>
    </g>

    <!-- Action Protocol (Plain Words) -->
    <g transform="translate(25, 275)">
      <rect width="670" height="75" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
      <text x="15" y="22" fill="#166534" font-family="'Patrick Hand', cursive, sans-serif" font-size="13" font-weight="bold">
        💡 What Nurse Priya Should Do (Action Guide):
      </text>
      <text x="15" y="42" fill="#14532d" font-family="'Patrick Hand', cursive, sans-serif" font-size="12">
        1. Check patient breathing &amp; chest movement immediately.
      </text>
      <text x="15" y="58" fill="#14532d" font-family="'Patrick Hand', cursive, sans-serif" font-size="12">
        2. Make sure the oxygen mask is fitted securely on face without leaks.
      </text>
      <text x="15" y="72" fill="#14532d" font-family="'Patrick Hand', cursive, sans-serif" font-size="12">
        3. Adjust sitting posture upright to assist oxygen intake.
      </text>
    </g>

    <!-- Nurse Action Note & Quick Chips -->
    <g transform="translate(25, 365)">
      <text x="0" y="0" fill="#475569" font-family="'Patrick Hand', cursive, sans-serif" font-size="12" font-weight="bold">
        📝 Nurse Action / Bedside Note:
      </text>
      <g transform="translate(180, -12)">
        <rect x="0" y="0" width="85" height="18" rx="9" fill="#f1f5f9" stroke="#94a3b8" />
        <text x="7" y="13" fill="#334155" font-size="10">+Airway Checked</text>
        <rect x="92" y="0" width="75" height="18" rx="9" fill="#f1f5f9" stroke="#94a3b8" />
        <text x="99" y="13" fill="#334155" font-size="10">+Doc Notified</text>
        <rect x="174" y="0" width="80" height="18" rx="9" fill="#f1f5f9" stroke="#94a3b8" />
        <text x="181" y="13" fill="#334155" font-size="10">+Mask Secured</text>
      </g>
      <rect x="0" y="10" width="670" height="42" rx="4" fill="#fafafa" stroke="#94a3b8" stroke-width="1.2" />
      <text x="12" y="34" fill="#64748b" font-family="'Patrick Hand', cursive, sans-serif" font-size="12">
        "Mask repositioned; patient seated upright. Acknowledging alarm to attend bedside."
      </text>
    </g>

    <!-- Action Buttons Footer -->
    <g transform="translate(25, 435)">
      <line x1="0" y1="0" x2="670" y2="0" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4" />

      <!-- 5-Min Quiet Mode -->
      <rect x="0" y="15" width="210" height="40" rx="6" fill="#f8fafc" stroke="#6366f1" stroke-width="1.5" />
      <text x="18" y="39" fill="#4338ca" font-family="'Patrick Hand', cursive, sans-serif" font-size="12" font-weight="bold">
        ⏱️ 5-Min Quiet Mode (During Care)
      </text>

      <!-- Close -->
      <rect x="290" y="15" width="75" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
      <text x="312" y="40" fill="#475569" font-family="'Patrick Hand', cursive, sans-serif" font-size="13">Close</text>

      <!-- Acknowledge -->
      <rect x="380" y="15" width="160" height="40" rx="6" fill="#f59e0b" />
      <text x="398" y="40" fill="#ffffff" font-family="'Patrick Hand', cursive, sans-serif" font-size="13" font-weight="bold">
        🔔 Acknowledge Alarm
      </text>

      <!-- Resolve -->
      <rect x="555" y="15" width="115" height="40" rx="6" fill="#10b981" />
      <text x="568" y="40" fill="#ffffff" font-family="'Patrick Hand', cursive, sans-serif" font-size="13" font-weight="bold">
        ✅ Mark Resolved
      </text>
    </g>
  </g>
</svg>
