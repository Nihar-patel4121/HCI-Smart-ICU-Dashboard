<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <!-- Paper / Sketch Grid Background -->
  <rect width="1000" height="650" fill="#fffdf9" />
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.8" />
    </pattern>
  </defs>
  <rect width="1000" height="650" fill="url(#grid)" />
  
  <!-- Header Bar -->
  <rect x="25" y="15" width="950" height="50" rx="8" fill="#1e293b" />
  <rect x="40" y="27" width="40" height="25" rx="4" fill="#0284c7" />
  <text x="47" y="44" fill="#ffffff" font-family="'Patrick Hand', cursive, sans-serif" font-size="14" font-weight="bold">ICU</text>
  <text x="90" y="44" fill="#ffffff" font-family="'Patrick Hand', cursive, sans-serif" font-size="16" font-weight="bold">Smart ICU Alarm Dashboard</text>
  
  <!-- Navigation Tabs -->
  <rect x="420" y="25" width="90" height="30" rx="15" fill="#0284c7" />
  <text x="432" y="45" fill="#ffffff" font-family="'Patrick Hand', cursive, sans-serif" font-size="13" font-weight="bold">Dashboard</text>
  <rect x="520" y="25" width="105" height="30" rx="15" fill="none" stroke="#475569" stroke-dasharray="3,3" />
  <text x="532" y="45" fill="#cbd5e1" font-family="'Patrick Hand', cursive, sans-serif" font-size="13">History Log</text>

  <!-- User / Nurse Badge -->
  <text x="780" y="45" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">11:55:00</text>
  <circle cx="865" cy="40" r="5" fill="#10b981" />
  <text x="878" y="45" fill="#ffffff" font-family="'Patrick Hand', cursive, sans-serif" font-size="13">Nurse Priya</text>

  <!-- Metric Overview Cards (5 Counters) -->
  <g transform="translate(25, 75)">
    <!-- Critical Metric -->
    <rect x="0" y="0" width="175" height="58" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8" />
    <text x="12" y="20" fill="#991b1b" font-family="'Patrick Hand', cursive, sans-serif" font-size="10" font-weight="bold">CRITICAL</text>
    <text x="12" y="48" fill="#b91c1c" font-family="'Architects Daughter', cursive, sans-serif" font-size="24" font-weight="bold">1</text>
    <text x="35" y="44" fill="#b91c1c" font-family="'Patrick Hand', cursive, sans-serif" font-size="10">Immediate Bedside</text>

    <!-- Warning Metric -->
    <rect x="190" y="0" width="175" height="58" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8" />
    <text x="202" y="20" fill="#92400e" font-family="'Patrick Hand', cursive, sans-serif" font-size="10" font-weight="bold">WARNINGS</text>
    <text x="202" y="48" fill="#b45309" font-family="'Architects Daughter', cursive, sans-serif" font-size="24" font-weight="bold">1</text>
    <text x="225" y="44" fill="#b45309" font-family="'Patrick Hand', cursive, sans-serif" font-size="10">Prompt Check</text>

    <!-- Sensor Metric -->
    <rect x="380" y="0" width="175" height="58" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.8" />
    <text x="392" y="20" fill="#075985" font-family="'Patrick Hand', cursive, sans-serif" font-size="10" font-weight="bold">SENSOR ALERTS</text>
    <text x="392" y="48" fill="#0369a1" font-family="'Architects Daughter', cursive, sans-serif" font-size="24" font-weight="bold">1</text>
    <text x="415" y="44" fill="#0369a1" font-family="'Patrick Hand', cursive, sans-serif" font-size="10">Routine Round</text>

    <!-- Acknowledged Metric -->
    <rect x="570" y="0" width="175" height="58" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.8" />
    <text x="582" y="20" fill="#854d0e" font-family="'Patrick Hand', cursive, sans-serif" font-size="10" font-weight="bold">ACKNOWLEDGED</text>
    <text x="582" y="48" fill="#a16207" font-family="'Architects Daughter', cursive, sans-serif" font-size="24" font-weight="bold">0</text>
    <text x="605" y="44" fill="#854d0e" font-family="'Patrick Hand', cursive, sans-serif" font-size="10">Nurse Assigned</text>

    <!-- Stable Metric -->
    <rect x="760" y="0" width="190" height="58" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.8" />
    <text x="772" y="20" fill="#166534" font-family="'Patrick Hand', cursive, sans-serif" font-size="10" font-weight="bold">STABLE PATIENTS</text>
    <text x="772" y="48" fill="#15803d" font-family="'Architects Daughter', cursive, sans-serif" font-size="24" font-weight="bold">3</text>
    <text x="795" y="44" fill="#166534" font-family="'Patrick Hand', cursive, sans-serif" font-size="10">Target Met</text>
  </g>

  <!-- Top Active Unit Alerts Feed (All 3 Tiers Stacked!) -->
  <g transform="translate(25, 145)">
    <!-- Alert 1: Critical -->
    <rect x="0" y="0" width="950" height="38" rx="6" fill="#fff5f5" stroke="#ef4444" stroke-width="1.5" />
    <rect x="0" y="0" width="6" height="38" rx="3" fill="#ef4444" />
    <rect x="12" y="8" width="80" height="22" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1" />
    <text x="20" y="23" fill="#b91c1c" font-family="'Patrick Hand', cursive, sans-serif" font-size="10" font-weight="bold">🚨 CRITICAL</text>
    <text x="102" y="24" fill="#0f172a" font-family="'Patrick Hand', cursive, sans-serif" font-size="12" font-weight="bold">Bed 1: Rajesh Kumar — Oxygen Level Dangerously Low (SpO2 88%)</text>
    <text x="490" y="24" fill="#64748b" font-family="'Patrick Hand', cursive, sans-serif" font-size="11">Heart spiked 125 bpm • Immediate bedside check</text>
    <rect x="820" y="6" width="120" height="26" rx="4" fill="#ef4444" />
    <text x="832" y="23" fill="#ffffff" font-family="'Patrick Hand', cursive, sans-serif" font-size="11" font-weight="bold">Inspect Bed 1 ➔</text>

    <!-- Alert 2: Warning -->
    <rect x="0" y="44" width="950" height="38" rx="6" fill="#fffdf7" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="0" y="44" width="6" height="38" rx="3" fill="#f59e0b" />
    <rect x="12" y="52" width="80" height="22" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" />
    <text x="20" y="67" fill="#b45309" font-family="'Patrick Hand', cursive, sans-serif" font-size="10" font-weight="bold">⚠️ WARNING</text>
    <text x="102" y="68" fill="#0f172a" font-family="'Patrick Hand', cursive, sans-serif" font-size="12" font-weight="bold">Bed 2: Sunita Devi — Breathing Faster Than Normal (26/min)</text>
    <text x="490" y="68" fill="#64748b" font-family="'Patrick Hand', cursive, sans-serif" font-size="11">O2 slightly low at 91% • Prompt clinical review</text>
    <rect x="820" y="50" width="120" height="26" rx="4" fill="#f59e0b" />
    <text x="832" y="67" fill="#ffffff" font-family="'Patrick Hand', cursive, sans-serif" font-size="11" font-weight="bold">Inspect Bed 2 ➔</text>

    <!-- Alert 3: Sensor -->
    <rect x="0" y="88" width="950" height="38" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5" />
    <rect x="0" y="88" width="6" height="38" rx="3" fill="#0284c7" />
    <rect x="12" y="96" width="80" height="22" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" />
    <text x="20" y="111" fill="#0369a1" font-family="'Patrick Hand', cursive, sans-serif" font-size="10" font-weight="bold">ℹ️ SENSOR</text>
    <text x="102" y="112" fill="#0f172a" font-family="'Patrick Hand', cursive, sans-serif" font-size="12" font-weight="bold">Bed 4: Meena Sharma — Heart Monitor Sticker Loose (Lead V4)</text>
    <text x="490" y="112" fill="#64748b" font-family="'Patrick Hand', cursive, sans-serif" font-size="11">Vitals safe (64 bpm) • Audio buzzer silenced</text>
    <rect x="820" y="94" width="120" height="26" rx="4" fill="#0284c7" />
    <text x="832" y="111" fill="#ffffff" font-family="'Patrick Hand', cursive, sans-serif" font-size="11" font-weight="bold">Check Bed 4 ➔</text>
  </g>

  <!-- Exactly 3 Patient Bed Cards Grid -->
  <g transform="translate(25, 290)">
    <text x="0" y="0" fill="#0f172a" font-family="'Architects Daughter', cursive, sans-serif" font-size="14" font-weight="bold">Monitored Patients (3 Beds Representation)</text>

    <!-- Bed 1 Card (Critical) -->
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="300" height="310" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2.2" />
      <text x="15" y="26" fill="#0f172a" font-family="'Patrick Hand', cursive, sans-serif" font-size="14" font-weight="bold">Bed 1: Rajesh Kumar (64)</text>
      <rect x="220" y="12" width="65" height="20" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1" />
      <text x="227" y="26" fill="#b91c1c" font-family="'Patrick Hand', cursive, sans-serif" font-size="9.5" font-weight="bold">CRITICAL</text>
      
      <text x="15" y="48" fill="#475569" font-family="'Patrick Hand', cursive, sans-serif" font-size="11.5">Dx: Post Heart Op • Doc: Dr. Mehta</text>
      <text x="15" y="64" fill="#64748b" font-family="'Patrick Hand', cursive, sans-serif" font-size="11">Target: O2 &gt;92%, Heart Rate 60-100</text>
      
      <!-- 4 Vitals Box with Single Number BP -->
      <g transform="translate(15, 75)">
        <rect x="0" y="0" width="270" height="60" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,3" />
        <!-- HR -->
        <text x="25" y="20" text-anchor="middle" fill="#64748b" font-size="9" font-weight="bold">HEART</text>
        <text x="25" y="44" text-anchor="middle" fill="#dc2626" font-family="'Architects Daughter'" font-size="17" font-weight="bold">125</text>
        <text x="25" y="55" text-anchor="middle" fill="#94a3b8" font-size="8.5">bpm</text>

        <!-- O2 -->
        <text x="95" y="20" text-anchor="middle" fill="#64748b" font-size="9" font-weight="bold">OXYGEN</text>
        <text x="95" y="44" text-anchor="middle" fill="#dc2626" font-family="'Architects Daughter'" font-size="17" font-weight="bold">88%</text>
        <text x="95" y="55" text-anchor="middle" fill="#94a3b8" font-size="8.5">sat</text>

        <!-- BP (Single Number 70 mmHg!) -->
        <text x="165" y="20" text-anchor="middle" fill="#64748b" font-size="9" font-weight="bold">PRESSURE</text>
        <text x="165" y="44" text-anchor="middle" fill="#dc2626" font-family="'Architects Daughter'" font-size="17" font-weight="bold">70</text>
        <text x="165" y="55" text-anchor="middle" fill="#94a3b8" font-size="8.5">mmHg</text>

        <!-- Resp -->
        <text x="235" y="20" text-anchor="middle" fill="#64748b" font-size="9" font-weight="bold">BREATHING</text>
        <text x="235" y="44" text-anchor="middle" fill="#d97706" font-family="'Architects Daughter'" font-size="17" font-weight="bold">26</text>
        <text x="235" y="55" text-anchor="middle" fill="#94a3b8" font-size="8.5">/min</text>
      </g>

      <!-- Alarm Callout -->
      <rect x="15" y="145" width="270" height="42" rx="4" fill="#fee2e2" stroke="#f87171" stroke-dasharray="2,2" />
      <text x="22" y="162" fill="#991b1b" font-family="'Patrick Hand', cursive, sans-serif" font-size="11.5" font-weight="bold">🚨 Critical: Oxygen Dangerously Low (88%)</text>
      <text x="22" y="178" fill="#7f1d1d" font-family="'Patrick Hand', cursive, sans-serif" font-size="10.5">Airway check and mask check needed immediately.</text>

      <!-- Action Button -->
      <rect x="15" y="200" width="270" height="34" rx="4" fill="#ef4444" />
      <text x="75" y="222" fill="#ffffff" font-family="'Patrick Hand', cursive, sans-serif" font-size="13" font-weight="bold">Inspect Critical Alarm ➔</text>
    </g>

    <!-- Bed 2 Card (Warning) -->
    <g transform="translate(325, 15)">
      <rect x="0" y="0" width="300" height="310" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2.2" />
      <text x="15" y="26" fill="#0f172a" font-family="'Patrick Hand', cursive, sans-serif" font-size="14" font-weight="bold">Bed 2: Sunita Devi (52)</text>
      <rect x="220" y="12" width="65" height="20" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" />
      <text x="227" y="26" fill="#b45309" font-family="'Patrick Hand', cursive, sans-serif" font-size="9.5" font-weight="bold">WARNING</text>
      
      <text x="15" y="48" fill="#475569" font-family="'Patrick Hand', cursive, sans-serif" font-size="11.5">Dx: Chest Infection • Doc: Dr. Sen</text>
      <text x="15" y="64" fill="#64748b" font-family="'Patrick Hand', cursive, sans-serif" font-size="11">Target: Keep O2 &gt;90%, Normal Breathing</text>
      
      <!-- 4 Vitals Box with Single Number BP -->
      <g transform="translate(15, 75)">
        <rect x="0" y="0" width="270" height="60" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,3" />
        <!-- HR -->
        <text x="25" y="20" text-anchor="middle" fill="#64748b" font-size="9" font-weight="bold">HEART</text>
        <text x="25" y="44" text-anchor="middle" fill="#0f172a" font-family="'Architects Daughter'" font-size="17" font-weight="bold">94</text>
        <text x="25" y="55" text-anchor="middle" fill="#94a3b8" font-size="8.5">bpm</text>

        <!-- O2 -->
        <text x="95" y="20" text-anchor="middle" fill="#64748b" font-size="9" font-weight="bold">OXYGEN</text>
        <text x="95" y="44" text-anchor="middle" fill="#d97706" font-family="'Architects Daughter'" font-size="17" font-weight="bold">91%</text>
        <text x="95" y="55" text-anchor="middle" fill="#94a3b8" font-size="8.5">sat</text>

        <!-- BP (Single Number 89 mmHg!) -->
        <text x="165" y="20" text-anchor="middle" fill="#64748b" font-size="9" font-weight="bold">PRESSURE</text>
        <text x="165" y="44" text-anchor="middle" fill="#0f172a" font-family="'Architects Daughter'" font-size="17" font-weight="bold">89</text>
        <text x="165" y="55" text-anchor="middle" fill="#94a3b8" font-size="8.5">mmHg</text>

        <!-- Resp -->
        <text x="235" y="20" text-anchor="middle" fill="#64748b" font-size="9" font-weight="bold">BREATHING</text>
        <text x="235" y="44" text-anchor="middle" fill="#d97706" font-family="'Architects Daughter'" font-size="17" font-weight="bold">26</text>
        <text x="235" y="55" text-anchor="middle" fill="#94a3b8" font-size="8.5">/min</text>
      </g>

      <!-- Alarm Callout -->
      <rect x="15" y="145" width="270" height="42" rx="4" fill="#fef3c7" stroke="#fbbf24" stroke-dasharray="2,2" />
      <text x="22" y="162" fill="#92400e" font-family="'Patrick Hand', cursive, sans-serif" font-size="11.5" font-weight="bold">⚠️ Warning: Breathing Rapid (26/min)</text>
      <text x="22" y="178" fill="#78350f" font-family="'Patrick Hand', cursive, sans-serif" font-size="10.5">Check if steam inhalation or nebulizer due.</text>

      <!-- Action Button -->
      <rect x="15" y="200" width="270" height="34" rx="4" fill="#f59e0b" />
      <text x="90" y="222" fill="#ffffff" font-family="'Patrick Hand', cursive, sans-serif" font-size="13" font-weight="bold">Inspect Warning ➔</text>
    </g>

    <!-- Bed 3 Card (Normal Stable) -->
    <g transform="translate(650, 15)">
      <rect x="0" y="0" width="300" height="310" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2.2" />
      <text x="15" y="26" fill="#0f172a" font-family="'Patrick Hand', cursive, sans-serif" font-size="14" font-weight="bold">Bed 3: Amit Patel (71)</text>
      <rect x="220" y="12" width="65" height="20" rx="4" fill="#dcfce7" stroke="#10b981" stroke-width="1" />
      <text x="230" y="26" fill="#15803d" font-family="'Patrick Hand', cursive, sans-serif" font-size="9.5" font-weight="bold">NORMAL</text>
      
      <text x="15" y="48" fill="#475569" font-family="'Patrick Hand', cursive, sans-serif" font-size="11.5">Dx: Infection Recovery • Doc: Dr. Sharma</text>
      <text x="15" y="64" fill="#64748b" font-family="'Patrick Hand', cursive, sans-serif" font-size="11">Target: Blood Pressure &amp; Temp Normal</text>
      
      <!-- 4 Vitals Box with Single Number BP -->
      <g transform="translate(15, 75)">
        <rect x="0" y="0" width="270" height="60" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,3" />
        <!-- HR -->
        <text x="25" y="20" text-anchor="middle" fill="#64748b" font-size="9" font-weight="bold">HEART</text>
        <text x="25" y="44" text-anchor="middle" fill="#0f172a" font-family="'Architects Daughter'" font-size="17" font-weight="bold">76</text>
        <text x="25" y="55" text-anchor="middle" fill="#94a3b8" font-size="8.5">bpm</text>

        <!-- O2 -->
        <text x="95" y="20" text-anchor="middle" fill="#64748b" font-size="9" font-weight="bold">OXYGEN</text>
        <text x="95" y="44" text-anchor="middle" fill="#0f172a" font-family="'Architects Daughter'" font-size="17" font-weight="bold">98%</text>
        <text x="95" y="55" text-anchor="middle" fill="#94a3b8" font-size="8.5">sat</text>

        <!-- BP (Single Number 85 mmHg!) -->
        <text x="165" y="20" text-anchor="middle" fill="#64748b" font-size="9" font-weight="bold">PRESSURE</text>
        <text x="165" y="44" text-anchor="middle" fill="#0f172a" font-family="'Architects Daughter'" font-size="17" font-weight="bold">85</text>
        <text x="165" y="55" text-anchor="middle" fill="#94a3b8" font-size="8.5">mmHg</text>

        <!-- Resp -->
        <text x="235" y="20" text-anchor="middle" fill="#64748b" font-size="9" font-weight="bold">BREATHING</text>
        <text x="235" y="44" text-anchor="middle" fill="#0f172a" font-family="'Architects Daughter'" font-size="17" font-weight="bold">16</text>
        <text x="235" y="55" text-anchor="middle" fill="#94a3b8" font-size="8.5">/min</text>
      </g>

      <!-- Safe Callout -->
      <rect x="15" y="145" width="270" height="42" rx="4" fill="#dcfce7" stroke="#86efac" stroke-dasharray="2,2" />
      <text x="22" y="162" fill="#166534" font-family="'Patrick Hand', cursive, sans-serif" font-size="11.5" font-weight="bold">✓ All vitals within safe normal range</text>
      <text x="22" y="178" fill="#15803d" font-family="'Patrick Hand', cursive, sans-serif" font-size="10.5">Patient resting quietly. Next round at 12:30.</text>

      <!-- Action Button -->
      <rect x="15" y="200" width="270" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="80" y="222" fill="#334155" font-family="'Patrick Hand', cursive, sans-serif" font-size="13" font-weight="bold">Check Patient Vitals ➔</text>
    </g>
  </g>

  <!-- Hand-drawn Post-it Sticky Note -->
  <g transform="translate(810, 480) rotate(-2)">
    <rect x="0" y="0" width="165" height="110" fill="#fef08a" stroke="#facc15" stroke-width="1.2" filter="drop-shadow(2px 3px 5px rgba(0,0,0,0.15))" />
    <rect x="50" y="-5" width="40" height="10" fill="rgba(250,204,21,0.5)" />
    <text x="12" y="22" fill="#713f12" font-family="'Caveat', cursive, sans-serif" font-size="14" font-weight="bold">📌 USER TEST ACTION:</text>
    <text x="12" y="40" fill="#713f12" font-family="'Caveat', cursive, sans-serif" font-size="13">Tap [Inspect Bed 1]</text>
    <text x="12" y="56" fill="#713f12" font-family="'Caveat', cursive, sans-serif" font-size="13">➔ Screen 2 pops up!</text>
    <text x="12" y="74" fill="#713f12" font-family="'Caveat', cursive, sans-serif" font-size="13">Tap [History Log]</text>
    <text x="12" y="90" fill="#713f12" font-family="'Caveat', cursive, sans-serif" font-size="13">➔ Screen 4 opens!</text>
  </g>
</svg>
